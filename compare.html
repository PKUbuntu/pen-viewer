<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pen Viewer - Compare Mode</title>
  <style>
    body { margin: 0; font-family: system-ui; background: #1a1a2e; color: #fff; }
    h1 { text-align: center; padding: 20px; }
    .container { display: flex; gap: 20px; padding: 20px; overflow-x: auto; }
    .panel { flex: 1; min-width: 400px; border: 2px solid #3b82f6; border-radius: 8px; }
    .panel-header { background: #3b82f6; padding: 10px; text-align: center; font-weight: bold; }
    .panel-content { height: 600px; overflow: auto; }
    .panel-content img { width: 100%; }
    iframe { width: 100%; height: 600px; border: none; }
  </style>
</head>
<body>
  <h1> pencil-new.pen 对比：PNG vs 渲染</h1>
  <div class="container">
    <div class="panel">
      <div class="panel-header">PNG 预览图 (原始)</div>
      <div class="panel-content">
        <img src="pencil-new.png" alt="PNG preview">
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">pen-viewer 渲染</div>
      <div class="panel-content">
        <iframe src="pen-viewer.html?file=pencil-new.pen"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
