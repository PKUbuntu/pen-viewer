<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>.pen Viewer</title>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 5.9% 90%;
    }
    .dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 3.7% 15.9%;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; }
    
    #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

<script>
// ====== Main Canvas Renderer ======
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let variables = {};
let rawVariables = {};
let currentTheme = { Mode: 'Light', Base: 'Neutral', Accent: 'Default' };
let currentZoom = 100;
let penDocument = null;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let panX = 0;
let panY = 0;
let renderScale = 1;
let renderOffsetX = 0;
let renderOffsetY = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (penDocument) renderDocument(penDocument);
}

function resolveVariables(doc) {
  variables = {};
  rawVariables = {};
  if (doc.children && doc.children[0] && doc.children[0].theme) {
    currentTheme = { ...currentTheme, ...doc.children[0].theme };
  }
  if (doc.variables) rawVariables = doc.variables;
  for (const [key, varDef] of Object.entries(rawVariables)) {
    if (!varDef || !varDef.value) { variables[key] = null; continue; }
    const values = Array.isArray(varDef.value) ? varDef.value : [{ value: varDef.value }];
    let matchedValue = null, defaultFallback = null;
    for (const item of values) {
      if (!item.theme && !defaultFallback) defaultFallback = item.value;
      if (item.theme) {
        let matches = true;
        for (const [tk, tv] of Object.entries(item.theme)) {
          if (currentTheme[tk] !== tv) { matches = false; break; }
        }
        if (matches) { matchedValue = item.value; break; }
      }
    }
    variables[key] = matchedValue || defaultFallback;
  }
}

function resolveColor(color) {
  if (!color) return null;
  if (typeof color === 'string') {
    if (color.startsWith('$')) return variables[color.slice(1)] || '#888';
    return color;
  }
  return color.colors?.[0]?.color || '#888';
}

function resolveSize(val, parentSize = 0) {
  if (val === 'fill_container') return parentSize;
  if (val === 'fit_content') return null;
  if (typeof val === 'string' && val.startsWith('$')) return variables[val.slice(1)] || 0;
  return val || 0;
}

function resolveStrokeThickness(thickness) {
  if (thickness === undefined || thickness === null) return 1;
  if (typeof thickness === 'number') return thickness;
  if (typeof thickness === 'object') return Math.max(thickness.top || 0, thickness.right || 0, thickness.bottom || 0, thickness.left || 0) || 1;
  return 1;
}

function drawRoundedRect(ctx, x, y, width, height, radius) {
  if (width <= 0 || height <= 0) return;
  radius = Math.min(radius || 0, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function renderNode(ctx, node, parentX = 0, parentY = 0, parentWidth = 0, parentHeight = 0) {
  const x = parentX + (node.x || 0);
  const y = parentY + (node.y || 0);
  const width = resolveSize(node.width, parentWidth);
  const height = resolveSize(node.height, parentHeight);
  if (width <= 0 || height <= 0) return;
  ctx.save();
  if (node.opacity !== undefined) ctx.globalAlpha = node.opacity;

  if (node.type === 'frame' || node.type === 'rectangle') {
    if (node.effect && node.effect.type === 'shadow') {
      ctx.shadowColor = resolveColor(node.effect.color) || 'rgba(0,0,0,0.1)';
      ctx.shadowBlur = node.effect.blur || 0;
      ctx.shadowOffsetX = node.effect.offset?.x || 0;
      ctx.shadowOffsetY = node.effect.offset?.y || 0;
    }
    const fillColor = resolveColor(node.fill);
    if (fillColor) {
      drawRoundedRect(ctx, x, y, width, height, node.cornerRadius || 0);
      ctx.fillStyle = fillColor;
      ctx.fill();
    }
    ctx.shadowColor = 'transparent';
    if (node.stroke && node.stroke.fill) {
      const strokeColor = resolveColor(node.stroke.fill);
      if (strokeColor) {
        drawRoundedRect(ctx, x, y, width, height, node.cornerRadius || 0);
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = resolveStrokeThickness(node.stroke.thickness);
        ctx.stroke();
      }
    }
  } else if (node.type === 'ellipse') {
    const fillColor = resolveColor(node.fill);
    if (fillColor) {
      ctx.beginPath();
      ctx.ellipse(x + width / 2, y + height / 2, width / 2, height / 2, 0, 0, Math.PI * 2);
      ctx.fillStyle = fillColor;
      ctx.fill();
    }
    if (node.stroke && node.stroke.fill) {
      const strokeColor = resolveColor(node.stroke.fill);
      if (strokeColor) {
        ctx.beginPath();
        ctx.ellipse(x + width / 2, y + height / 2, width / 2, height / 2, 0, 0, Math.PI * 2);
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = resolveStrokeThickness(node.stroke.thickness);
        ctx.stroke();
      }
    }
  } else if (node.type === 'line') {
    const strokeColor = resolveColor(node.stroke?.fill || node.fill);
    if (strokeColor) {
      ctx.beginPath();
      const startX = node.x1 !== undefined ? x : x;
      const startY = node.y1 !== undefined ? y : y;
      const endX = node.x2 !== undefined ? x + node.x2 - (node.x || 0) : x + width;
      const endY = node.y2 !== undefined ? y + node.y2 - (node.y || 0) : y + height;
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = resolveStrokeThickness(node.stroke?.thickness || node.thickness || 1);
      if (node.stroke?.lineCap) ctx.lineCap = node.stroke.lineCap;
      if (node.stroke?.lineJoin) ctx.lineJoin = node.stroke.lineJoin;
      ctx.stroke();
    }
  } else if (node.type === 'path') {
    const strokeColor = resolveColor(node.stroke?.fill || node.fill);
    const fillPathColor = resolveColor(node.fill);
    if (node.path) {
      ctx.beginPath();
      const pathCommands = parsePath(node.path);
      drawPath(ctx, pathCommands, x, y, width, height);
      if (fillPathColor) {
        ctx.fillStyle = fillPathColor;
        ctx.fill();
      }
      if (strokeColor) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = resolveStrokeThickness(node.stroke?.thickness || 1);
        ctx.stroke();
      }
    }
  } else if (node.type === 'image' && node.src) {
    renderImage(ctx, node, x, y, width, height);
  } else if (node.type === 'text') {
    renderText(ctx, node, x, y, width, height);
  }
  ctx.restore();
  if (node.children && node.children.length > 0) renderChildren(ctx, node, x, y, width, height);
}

// Parse SVG-like path commands
function parsePath(pathStr) {
  const commands = [];
  const regex = /([MmLlHhVvCcSsQqTtAaZz])([^MmLlHhVvCcSsQqTtAaZz]*)/g;
  let match;
  while ((match = regex.exec(pathStr)) !== null) {
    const cmd = match[1];
    const args = match[2].trim().split(/[\s,]+/).filter(s => s).map(Number);
    commands.push({ cmd, args });
  }
  return commands;
}

// Draw path commands on canvas
function drawPath(ctx, commands, x, y, width, height) {
  let currentX = 0, currentY = 0;
  let startX = 0, startY = 0;
  let lastControlX = 0, lastControlY = 0;

  for (const { cmd, args } of commands) {
    switch (cmd) {
      case 'M':
        currentX = x + args[0];
        currentY = y + args[1];
        startX = currentX;
        startY = currentY;
        ctx.moveTo(currentX, currentY);
        break;
      case 'm':
        currentX += args[0];
        currentY += args[1];
        startX = currentX;
        startY = currentY;
        ctx.moveTo(currentX, currentY);
        break;
      case 'L':
        currentX = x + args[0];
        currentY = y + args[1];
        ctx.lineTo(currentX, currentY);
        break;
      case 'l':
        currentX += args[0];
        currentY += args[1];
        ctx.lineTo(currentX, currentY);
        break;
      case 'H':
        currentX = x + args[0];
        ctx.lineTo(currentX, currentY);
        break;
      case 'h':
        currentX += args[0];
        ctx.lineTo(currentX, currentY);
        break;
      case 'V':
        currentY = y + args[0];
        ctx.lineTo(currentX, currentY);
        break;
      case 'v':
        currentY += args[0];
        ctx.lineTo(currentX, currentY);
        break;
      case 'C':
        ctx.bezierCurveTo(
          x + args[0], y + args[1],
          x + args[2], y + args[3],
          x + args[4], y + args[5]
        );
        lastControlX = x + args[2];
        lastControlY = y + args[3];
        currentX = x + args[4];
        currentY = y + args[5];
        break;
      case 'c':
        ctx.bezierCurveTo(
          currentX + args[0], currentY + args[1],
          currentX + args[2], currentY + args[3],
          currentX + args[4], currentY + args[5]
        );
        lastControlX = currentX + args[2];
        lastControlY = currentY + args[3];
        currentX += args[4];
        currentY += args[5];
        break;
      case 'S':
        ctx.bezierCurveTo(
          2 * currentX - lastControlX, 2 * currentY - lastControlY,
          x + args[0], y + args[1],
          x + args[2], y + args[3]
        );
        lastControlX = x + args[0];
        lastControlY = y + args[1];
        currentX = x + args[2];
        currentY = y + args[3];
        break;
      case 's':
        ctx.bezierCurveTo(
          2 * currentX - lastControlX, 2 * currentY - lastControlY,
          currentX + args[0], currentY + args[1],
          currentX + args[2], currentY + args[3]
        );
        lastControlX = currentX + args[0];
        lastControlY = currentY + args[1];
        currentX += args[2];
        currentY += args[3];
        break;
      case 'Q':
        ctx.quadraticCurveTo(
          x + args[0], y + args[1],
          x + args[2], y + args[3]
        );
        lastControlX = x + args[0];
        lastControlY = y + args[1];
        currentX = x + args[2];
        currentY = y + args[3];
        break;
      case 'q':
        ctx.quadraticCurveTo(
          currentX + args[0], currentY + args[1],
          currentX + args[2], currentY + args[3]
        );
        lastControlX = currentX + args[0];
        lastControlY = currentY + args[1];
        currentX += args[2];
        currentY += args[3];
        break;
      case 'Z':
      case 'z':
        ctx.closePath();
        currentX = startX;
        currentY = startY;
        break;
    }
  }
}

// Image cache
const imageCache = {};
function renderImage(ctx, node, x, y, width, height) {
  const src = resolveImageSrc(node.src);
  if (!src) return;

  if (imageCache[src]) {
    const img = imageCache[src];
    if (img.complete) {
      ctx.drawImage(img, x, y, width, height);
    }
    return;
  }

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    imageCache[src] = img;
    ctx.drawImage(img, x, y, width, height);
  };
  img.onerror = () => {
    ctx.fillStyle = '#e5e7eb';
    drawRoundedRect(ctx, x, y, width, height, node.cornerRadius || 0);
    ctx.fill();
  };
  img.src = src;
}

function resolveImageSrc(src) {
  if (!src) return null;
  if (typeof src === 'string') return src;
  if (src.type === 'url' && src.url) return src.url;
  if (src.type === 'data' && src.data) return src.data;
  return null;
}

// Text rendering
function renderText(ctx, node, x, y, width, height) {
  const fillColor = resolveColor(node.fill);
  if (!fillColor) return;

  ctx.fillStyle = fillColor;
  const fontSize = node.fontSize || 14;
  const fontWeight = node.fontWeight || 'normal';
  const fontFamily = node.fontFamily || '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
  ctx.textAlign = node.textAlign || 'left';
  ctx.textBaseline = node.textBaseline || 'top';

  const content = node.content || '';
  const lineHeight = node.lineHeight || fontSize * 1.2;
  const textAlignVertical = node.textAlignVertical || 'start';

  let textX = x;
  if (node.textAlign === 'center') textX = x + (width || 0) / 2;
  else if (node.textAlign === 'right') textX = x + (width || 0);

  let textY = y;
  if (textAlignVertical === 'middle') textY = y + (height || 0) / 2 - (lineHeight * getLineCount(content) - lineHeight) / 2;
  else if (textAlignVertical === 'end') textY = y + (height || 0) - getLineCount(content) * lineHeight;

  const lines = content.split('\n');
  const maxWidth = width || 1000;

  lines.forEach((line, index) => {
    if (node.textOverflow === 'ellipsis' && ctx.measureText(line).width > maxWidth) {
      line = truncateText(ctx, line, maxWidth);
    }
    ctx.fillText(line, textX, textY + index * lineHeight);
  });
}

function getLineCount(text) {
  return text.split('\n').length;
}

function truncateText(ctx, text, maxWidth) {
  let truncated = text;
  while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 0) {
    truncated = truncated.slice(0, -1);
  }
  return truncated + '...';
}

function renderChildren(ctx, parent, parentX, parentY, parentWidth, parentHeight) {
  if (!parent.children || parent.children.length === 0) return;
  const layout = parent.layout || 'none';
  
  // 解析 padding - 支持数字、数组（2 个或 4 个值）
  const padding = parent.padding ?? 0;
  let paddingTop = 0, paddingRight = 0, paddingBottom = 0, paddingLeft = 0;
  if (Array.isArray(padding)) {
    if (padding.length === 2) {
      paddingTop = paddingBottom = padding[0] ?? 0;
      paddingLeft = paddingRight = padding[1] ?? 0;
    } else if (padding.length >= 4) {
      [paddingTop, paddingRight, paddingBottom, paddingLeft] = padding.map(v => v ?? 0);
    }
  } else {
    const p = padding ?? 0;
    paddingTop = paddingRight = paddingBottom = paddingLeft = p;
  }
  
  const gap = parent.gap ?? 0;
  const justifyContent = parent.justifyContent || 'start';
  const alignItems = parent.alignItems || 'start';
  
  const contentX = parentX + paddingLeft;
  const contentY = parentY + paddingTop;
  const contentWidth = Math.max(0, parentWidth - paddingLeft - paddingRight);
  const contentHeight = Math.max(0, parentHeight - paddingTop - paddingBottom);

  if (layout === 'none') {
    parent.children.forEach(child => renderNode(ctx, child, parentX, parentY, parentWidth, parentHeight));
    return;
  }
  
  if (layout === 'horizontal') {
    const childrenWithWidth = parent.children.map(child => ({ 
      child, 
      width: resolveSize(child.width, contentWidth) ?? 0 
    }));
    const totalChildrenWidth = childrenWithWidth.reduce((s, { width }) => s + width, 0);
    const totalGapWidth = Math.max(0, childrenWithWidth.length - 1) * gap;

    let startX = contentX;
    const availableSpace = contentWidth - totalChildrenWidth - totalGapWidth;
    
    if (justifyContent === 'center') {
      startX = contentX + availableSpace / 2;
    } else if (justifyContent === 'end') {
      startX = contentX + availableSpace;
    } else if (justifyContent === 'space_between' && childrenWithWidth.length > 1) {
      startX = contentX;
    } else if (justifyContent === 'space_around') {
      startX = contentX + availableSpace / 2;
    } else if (justifyContent === 'space_evenly') {
      startX = contentX;
    }

    let currentX = startX;
    childrenWithWidth.forEach((item, i) => {
      const childHeight = resolveSize(item.child.height, contentHeight) ?? item.child.height ?? 0;
      let childY = contentY;
      
      if (alignItems === 'center') {
        childY = contentY + (contentHeight - childHeight) / 2;
      } else if (alignItems === 'end') {
        childY = contentY + contentHeight - childHeight;
      } else if (alignItems === 'stretch') {
        // stretch 模式下使用完整内容高度
      }

      let itemX = currentX;
      
      // space_between: 第一个和最后一个贴边，中间均匀分布
      if (justifyContent === 'space_between' && childrenWithWidth.length > 1) {
        if (i === 0) {
          itemX = contentX;
        } else if (i === childrenWithWidth.length - 1) {
          itemX = contentX + contentWidth - item.width;
        } else {
          const betweenGap = (contentWidth - totalChildrenWidth) / (childrenWithWidth.length - 1);
          itemX = contentX + i * betweenGap + childrenWithWidth.slice(0, i).reduce((s, c) => s + c.width, 0);
        }
      } 
      // space_evenly: 包括两端的间隙都相等
      else if (justifyContent === 'space_evenly') {
        const evenGap = (contentWidth - totalChildrenWidth) / (childrenWithWidth.length + 1);
        itemX = contentX + evenGap * (i + 1) + childrenWithWidth.slice(0, i).reduce((s, c) => s + c.width, 0);
      }

      renderNode(ctx, item.child, itemX, childY, item.width, childHeight);
      
      // 更新下一个元素的位置（仅用于 start/center/end/space_around）
      if (justifyContent !== 'space_between' && justifyContent !== 'space_evenly') {
        currentX = itemX + item.width + gap;
      }
    });
    return;
  }
  
  if (layout === 'vertical') {
    const childrenWithHeight = parent.children.map(child => ({ 
      child, 
      height: resolveSize(child.height, contentHeight) ?? 0 
    }));
    const totalChildrenHeight = childrenWithHeight.reduce((s, { height }) => s + height, 0);
    const totalGapHeight = Math.max(0, childrenWithHeight.length - 1) * gap;

    let currentY = contentY;
    const availableSpace = contentHeight - totalChildrenHeight - totalGapHeight;
    
    if (justifyContent === 'center') {
      currentY = contentY + availableSpace / 2;
    } else if (justifyContent === 'end') {
      currentY = contentY + availableSpace;
    } else if (justifyContent === 'space_between' && childrenWithHeight.length > 1) {
      currentY = contentY;
    } else if (justifyContent === 'space_around') {
      currentY = contentY + availableSpace / 2;
    } else if (justifyContent === 'space_evenly') {
      currentY = contentY;
    }

    parent.children.forEach((child, i) => {
      const childWidth = resolveSize(child.width, contentWidth) ?? child.width ?? 0;
      let childHeight = childrenWithHeight[i].height;
      let childX = contentX;
      
      if (alignItems === 'center') {
        childX = contentX + (contentWidth - childWidth) / 2;
      } else if (alignItems === 'end') {
        childX = contentX + contentWidth - childWidth;
      } else if (alignItems === 'stretch') {
        // stretch 模式下使用完整内容宽度
      }

      let itemY = currentY;
      
      // space_between: 第一个和最后一个贴边，中间均匀分布
      if (justifyContent === 'space_between' && childrenWithHeight.length > 1) {
        if (i === 0) {
          itemY = contentY;
        } else if (i === childrenWithHeight.length - 1) {
          itemY = contentY + contentHeight - childHeight;
        } else {
          const betweenGap = (contentHeight - totalChildrenHeight) / (childrenWithHeight.length - 1);
          itemY = contentY + i * betweenGap + childrenWithHeight.slice(0, i).reduce((s, c) => s + c.height, 0);
        }
      } 
      // space_evenly: 包括两端的间隙都相等
      else if (justifyContent === 'space_evenly') {
        const evenGap = (contentHeight - totalChildrenHeight) / (childrenWithHeight.length + 1);
        itemY = contentY + evenGap * (i + 1) + childrenWithHeight.slice(0, i).reduce((s, c) => s + c.height, 0);
      }

      renderNode(ctx, child, childX, itemY, childWidth, childHeight);
      
      // 更新下一个元素的位置（仅用于 start/center/end/space_around）
      if (justifyContent !== 'space_between' && justifyContent !== 'space_evenly') {
        currentY = itemY + childHeight + gap;
      }
    });
    return;
  }
}

function renderDocument(doc) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  resolveVariables(doc);
  if (doc.children && doc.children.length > 0) {
    let minX = 0, minY = 0, maxWidth = canvas.width, maxHeight = canvas.height;
    doc.children.forEach(child => {
      if (child.x && child.x < minX) minX = child.x;
      if (child.y && child.y < minY) minY = child.y;
      if (child.width && typeof child.width === 'number' && child.width > maxWidth) maxWidth = child.width;
      if (child.height && typeof child.height === 'number' && child.height > maxHeight) maxHeight = child.height;
    });
    const baseScale = currentZoom / 100;
    const fitScale = Math.min(canvas.width / maxWidth, canvas.height / maxHeight, 1);
    renderScale = fitScale * baseScale;
    renderOffsetX = (minX < 0 ? -minX : 0) + panX;
    renderOffsetY = (minY < 0 ? -minY : 0) + panY;
    
    ctx.save();
    ctx.translate(renderOffsetX, renderOffsetY);
    ctx.scale(renderScale, renderScale);
    doc.children.forEach(child => {
      let width = resolveSize(child.width, maxWidth);
      let height = resolveSize(child.height, maxHeight);
      if (!child.width) width = maxWidth;
      if (!child.height) height = maxHeight;
      renderNode(ctx, child, child.x || 0, child.y || 0, width, height);
    });
    ctx.restore();
  }
}

async function loadSample() {
  try {
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file') || 'pencil-new.pen';
    const response = await fetch(file);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const doc = JSON.parse(await response.text());
    penDocument = doc;
    panX = 0; panY = 0; currentZoom = 100;
    renderDocument(doc);
  } catch (err) {
    console.error('Failed:', err);
  }
}

function setupPan() {
  canvas.style.cursor = 'grab';
  
  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragStartX = e.clientX - panX;
    dragStartY = e.clientY - panY;
    canvas.style.cursor = 'grabbing';
  });
  
  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - dragStartX;
    panY = e.clientY - dragStartY;
    if (penDocument) renderDocument(penDocument);
  });
  
  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      canvas.style.cursor = 'grab';
    }
  });
  
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -10 : 10;
    currentZoom = Math.max(25, Math.min(400, currentZoom + delta));
    if (penDocument) renderDocument(penDocument);
  }, { passive: false });
}

// Setup
window.onload = () => {
  resizeCanvas();
  loadSample();
  setupPan();
};

window.onresize = resizeCanvas;
</script>
